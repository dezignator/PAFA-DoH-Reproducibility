# Values transcribed from Chapter 4 of the thesis. Nothing here is computed by
# this repository. `evidence`: hw = hardware measurement, tb = software testbed,
# cfg = configuration/design target, def = definition. `sw_repro`: can the number
# be regenerated without the original hardware (Loihi, A100, ChipWhisperer)?
table13:
  title: Neuromorphic computing efficiency
  rows:
    - {metric: Inference latency, loihi: "0.8 ms", gpu_a100: "2.1 ms", gain: "2.6x", evidence: hw, sw_repro: no, section: "4.12, 4.25"}
    - {metric: Energy per inference, loihi: "0.12 mJ", gpu_a100: "1.8 mJ", gain: "15x", evidence: hw, sw_repro: no, section: "4.25"}
    - {metric: Spike encoding efficiency, loihi: "0.45 bits/spike", gpu_a100: "n/a", gain: "n/a", evidence: tb, sw_repro: partial, section: "4.27.4, 4.29.1"}
table14:
  title: Attack simulation metrics
  rows:
    - {attack: DNS tunnelling, rate_pct: 99.5, tool: dnscat2, evidence: tb, sw_repro: partial, section: "4.26.1"}
    - {attack: C2 heartbeat, rate_pct: 98.7, tool: "custom beacon generator", evidence: tb, sw_repro: partial, section: "4.26.4"}
    - {attack: Side-channel (classical timing/power), rate_pct: 100.0, tool: ChipWhisperer, evidence: hw, sw_repro: no, section: "4.26.3"}
table15:
  title: Zero-knowledge attestation performance (Groth16 path)
  rows:
    - {parameter: Proof generation time, target: "< 500 ms", measured: "432 ms", evidence: tb, sw_repro: partial, section: "4.16, 4.27.2"}
    - {parameter: Proof verification time, target: "< 100 ms", measured: "78 ms", evidence: tb, sw_repro: partial, section: "4.27.2"}
    - {parameter: Soundness error, target: "<= 2^-128", measured: "2^-132", evidence: cfg, sw_repro: no, section: "4.23"}
    - {parameter: Proof size, target: "<= 2 KB", measured: "1.8 KB", evidence: tb, sw_repro: yes, section: "4.27.2"}
table16:
  title: Federated learning performance and robustness (eps = 1.2)
  rows:
    - {metric: Global model accuracy, target: ">= 99.2%", achieved: "99.4% (+-0.12%, 95% CI)", test: "Welch t-test, p < 0.01", evidence: tb, sw_repro: partial}
    - {metric: Privacy-utility trade-off, target: "eps <= 1.5", achieved: "eps = 1.2 (utility > 98.7%)", test: "KL divergence, p < 0.05", evidence: tb, sw_repro: partial}
    - {metric: Convergence efficiency, target: "<= 10 epochs", achieved: "8 epochs (delta = 1e-3)", test: "KS test, p < 0.05", evidence: tb, sw_repro: partial}
    - {metric: Client dropout resilience, target: ">= 95%", achieved: "97.3% (up to 20% dropout)", test: "chi-squared GoF, p < 0.01", evidence: tb, sw_repro: partial}
    - {metric: Adversarial robustness, target: ">= 95%", achieved: "96.8% (GAN-crafted queries)", test: "Mann-Whitney U, p < 0.01", evidence: tb, sw_repro: partial}
table17:
  title: Topological data analysis validation
  rows:
    - {feature: Betti number beta_1, benign: "2.1 +- 0.3", attack: "5.8 +- 1.2", p: "p < 0.001", section: "4.7-4.8"}
    - {feature: Persistence entropy, benign: "0.85 +- 0.1", attack: "1.92 +- 0.4", p: "p = 0.002", section: "4.7.1"}
    - {feature: Wasserstein distance, benign: "1.3 +- 0.2", attack: "3.7 +- 0.9", p: "p < 0.001", section: "4.7.2"}
