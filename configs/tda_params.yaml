# tda_params.yaml — PAFA-DoH Reproducibility Artifact
# ═══════════════════════════════════════════════════════════════════════════
#
# Companion to:
#   configs/default_pafa_config.yaml    (File 9, master config)
#   README.md, REPRODUCIBILITY_CHECKLIST.md, LICENSE
#
# Thesis chapter: Chapter 4 (PAFA-DoH)
# Citation DOI:   10.1016/j.neunet.2025.108343
# License:        MIT
# Artifact version: 1.0.0
#
# ───────────────────────────────────────────────────────────────────────────
# Purpose
# ───────────────────────────────────────────────────────────────────────────
# Configures the topological-data-analysis detector. Consumed by:
#
#   src/models/tda_detector.py            (File 12d)
#   src/utils/math_utils.py               (File 11f) — Eqs. 40, 41, 42
#   src/cli_tools/tda_cli.py              (File 15d)
#   scripts/reproduce_tables/table_17_tda_validation.py (File 18e)
#
# ───────────────────────────────────────────────────────────────────────────
# Where each value comes from in the chapter
# ───────────────────────────────────────────────────────────────────────────
#   persistence.*           → §4.7.1, Eq. 40 (Vietoris–Rips filtration)
#   anomaly_scoring.*       → §4.7.2, Eq. 41 (p-Wasserstein)
#   significance.*          → §4.8.1, Eq. 42 (hypothesis test, Bonferroni)
#   reported_targets.*      → Table 17
# ═══════════════════════════════════════════════════════════════════════════

version: "1.0.0"


# ─── Persistence diagram construction ────────────────────────────────────
# §4.7.1, Eq. 40. Vietoris–Rips simplicial complex over the point cloud
# of each flow, with the Euclidean metric. Persistence diagrams are
# computed in dimensions H_0 and H_1; H_1 (the loops) is the dimension
# that carries the periodic C2-beaconing and tunneling signature.
persistence:
  complex: "vietoris_rips"     # [thesis] §4.7.1.
  homology_dimensions: [0, 1]  # [thesis] §4.7.1.
  filtration_max: 100.0        # [default] Maximum edge length of the
                               #           filtration. Chosen so that
                               #           the H_1 features of the
                               #           dataset are captured before
                               #           the complex fills in.
  filtration_steps: 256        # [default] Number of filtration scales.
                               #           Higher values increase
                               #           resolution at the cost of
                               #           compute time on the 32 GB
                               #           corpus.
  backend: "ripser"            # [thesis] §4.7.1. `ripser` is the fast
                               #          implementation; `gudhi` is
                               #          the reference and is used
                               #          for the cross-check in
                               #          tests/test_models.py (File
                               #          21b).


# ─── Anomaly score ────────────────────────────────────────────────────────
# §4.7.2, Eq. 41. p-Wasserstein distance from the test persistence
# diagram to a benign reference diagram, with points on the diagonal
# admissible. The threshold is a fixed quantile of the scores computed
# on a held-out benign reference split.
anomaly_scoring:
  metric: "wasserstein"        # [thesis] §4.7.2.
  p: 2                         # [thesis] Eq. 41 (2-Wasserstein, i.e.
                               #          "quadratic").
  reference_split: "benign"    # [thesis] §4.7.2.
  threshold_quantile: 0.99     # [default] The threshold is the 99th
                               #           percentile of benign-reference
                               #           scores; this corresponds to a
                               #           target FPR ≤ 1 %. The
                               #           chapter's Table 17 reporting
                               #           uses the same operating
                               #           point.
  recompute_threshold_each_round: true
                               # [default] Recompute the quantile after
                               #           each federated round so that
                               #           the operating point tracks
                               #           the global model (§4.7.2).


# ─── Statistical significance ────────────────────────────────────────────
# §4.8.1, Eq. 42. Null = same topological distribution. Test statistic
# = distance between empirical persistence diagrams. The null
# distribution is obtained by resampling; the p-value is the fraction
# of resamples that exceed the observed statistic. Bonferroni
# correction is applied across the three features (Betti-1, persistence
# entropy, Wasserstein).
significance:
  bonferroni_correction: true  # [thesis] §4.8.1.
  alpha: 0.05                  # [default] Nominal level; corrected
                               #           threshold is alpha / 3 ≈
                               #           0.0167, which still admits
                               #           the observed p-values
                               #           (0.002, < 0.001, < 0.001).
  resamples: 1000              # [default] Number of resamples used by
                               #           the null distribution.
  random_seed: 42              # [default] Must equal
                               #           default_pafa_config.yaml::seed.


# ─── Reported targets ────────────────────────────────────────────────────
# Table 17. These are the *reported* values, not artifacts' own
# measurements. The committed expected file
# (expected_outputs/table_17_expected.json, File 20e) records the
# artifact's own values; verification_script.py compares the two with
# the tolerance in REPRODUCIBILITY_CHECKLIST.md §8 (rtol = 0.05 on
# means/stds; categorical match on bracketed p-values; −log10(p)
# within 5 % on the point estimate).
reported_targets:
  betti_1_benign:
    mean: 2.1                  # [thesis] Table 17.
    std: 0.3                   # [thesis] Table 17.
  betti_1_attack:
    mean: 5.8                  # [thesis] Table 17.
    std: 1.2                   # [thesis] Table 17.
  persistence_entropy_benign:
    mean: 0.85                 # [thesis] Table 17.
    std: 0.1                   # [thesis] Table 17.
  persistence_entropy_attack:
    mean: 1.92                 # [thesis] Table 17.
    std: 0.4                   # [thesis] Table 17.
  wasserstein_benign:
    mean: 1.3                  # [thesis] Table 17.
    std: 0.2                   # [thesis] Table 17.
  wasserstein_attack:
    mean: 3.7                  # [thesis] Table 17.
    std: 0.9                   # [thesis] Table 17.
  p_values:
    betti_1: "< 0.001"         # [thesis] Table 17 (bracket, not point
                               #          estimate). The verification
                               #          script accepts any produced
                               #          p-value strictly less than
                               #          0.001.
    persistence_entropy: "0.002"
                               # [thesis] Table 17 (point estimate).
                               #          The verification script
                               #          compares -log10(p) within
                               #          5 %.
    wasserstein: "< 0.001"     # [thesis] Table 17 (bracket, not point
                               #          estimate).


# ─── Seed ────────────────────────────────────────────────────────────────
seed:
  tda_seed: 42                 # [default] Must equal
                               #           default_pafa_config.yaml::seed.
                               #           Consumed by File 12d for the
                               #           resample ordering.
