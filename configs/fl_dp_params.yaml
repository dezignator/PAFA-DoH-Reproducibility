# Artifact version: 1.0.0
#
# ───────────────────────────────────────────────────────────────────────────
# Purpose
# ───────────────────────────────────────────────────────────────────────────
# Configures the federated-learning, differential-privacy, Byzantine-robust
# aggregation and convergence blocks of PAFA-DoH. Consumed by:
#
#   src/models/federated_learning.py    (File 12b)   — the trainer
#   src/utils/math_utils.py             (File 11f)   — Eqs. 36, 37, 38, 39, 60
#   src/cli_tools/federated_cli.py      (File 15b)   — the CLI
#   scripts/train_pafa.py               (File 17a)   — the pipeline
#   scripts/reproduce_tables/
#     table_16_federated_learning.py    (File 18d)   — Table 16
#
# Value tags (same convention as File 9):
#   [thesis]   Value taken verbatim from Chapter 4.
#   [derived]  Computed from another [thesis] value or from a formula.
#   [default]  Engineering default not in the chapter.
#
# ───────────────────────────────────────────────────────────────────────────
# Where each value comes from in the chapter
# ───────────────────────────────────────────────────────────────────────────
#   dp_sgd.epsilon            → Table 16, §4.28.1
#   dp_sgd.clipping_norm      → Table 17a, "DP-SGD (Abadi et al., CCS 2016)
#                               — ε=1.2, C=3.5"
#   dp_sgd.num_clients        → Table 16, "Federated clients 100"
#   aggregation.method        → §4.6.3, Eq. 38 (geometric median)
#   byzantine.max_malicious   → Table 16, "tested up to 20 % dropout"
#   byzantine.mad_multiplier  → Table 27 (CLI example: --mads 2.5)
#   convergence.max_epochs    → Table 16, target ≤ 10 epochs
#   convergence.target_acc    → Table 16, target ≥ 99.2 %
#   convergence.grad_norm     → Table 16, δ = 10⁻³
#   accountant.composition    → §4.22, Eq. 60 (moments accountant)
# ═══════════════════════════════════════════════════════════════════════════

version: "1.0.0"


# ─── Differential-privacy SGD ─────────────────────────────────────────────
# §4.6.2, Eq. 36–37. Every client update is l2-clipped to
# clipping_norm, and isotropic Gaussian noise scaled by
# noise_multiplier × clipping_norm is added to the aggregate.
dp_sgd:
  epsilon: 1.2                 # [thesis] Table 16. Target DP budget.
                               #          Do NOT change to a smaller value
                               #          without re-calibrating
                               #          noise_multiplier below; the
                               #          committed expected outputs were
                               #          produced at ε = 1.2.
  delta: 1.0e-5                # [default] Standard δ for ε ≤ 1.5 regimes;
                               #           smaller than 1/num_clients would
                               #           over-restrict the noise budget.
  clipping_norm: 3.5           # [thesis] Table 17a. Per-client l2 clip.
  noise_multiplier: 1.1        # [derived] Calibrated for
                               #           (ε=1.2, δ=1e-5, C=3.5,
                               #            clients=100, batch=64,
                               #            rounds=100) via the moments
                               #            accountant (§4.22, Eq. 60).
                               #            Re-derive with
                               #            src/utils/math_utils.py::
                               #            moments_accountant (File 11f);
                               #            the script prints the achieved
                               #            ε for σ = 1.1 as 1.198.
  batch_size: 64               # [default] 64 is the batch used by the
                               #           committed expected outputs.
  num_clients: 100             # [thesis] Table 16 ("Federated clients
                               #          100") and Table 27
                               #          (`fl-coord --clients 100`).
  sampling_fraction: 0.64      # [derived] = batch_size / num_clients.
                               #           Consumed by the RDP accountant
                               #           below; do not edit independently.


# ─── Aggregation ──────────────────────────────────────────────────────────
# §4.6.3, Eq. 38. Weighted geometric median computed by IRLS. The
# geometric median is the published Byzantine-robust rule; the artifact
# ships the IRLS solver, not a new aggregation rule.
aggregation:
  method: "geometric_median"   # [thesis] §4.6.3.
  irls_max_iter: 100           # [default] Chosen so that the IRLS
                               #           convergence is monotone on the
                               #           100-client / 47-feature setup.
                               #           Lowering to 20 speeds up each
                               #           round by ≈ 4× at the cost of
                               #           a slightly less exact median.
  irls_tolerance: 1.0e-6       # [default] Relative convergence on the
                               #           L2 norm of the weight vector.


# ─── Byzantine robustness ─────────────────────────────────────────────────
# §4.6.3 and §4.28.1. Table 16 reports "97.3 % recovery under up to 20 %
# dropout". The MAD (median absolute deviation) outlier screen is the
# engineering safeguard layered on top of the geometric median; the
# multiplier 2.5 is the value in Table 27's `--mads 2.5` example.
byzantine:
  max_malicious_fraction: 0.20 # [thesis] Table 16 ("tested with up to
                               #           20 % dropout").
  mad_multiplier: 2.5          # [default] An update whose deviation from
                               #           the geometric median exceeds
                               #           mad_multiplier × MAD is
                               #           rejected for that round.
  cross_check_with_tda: true   # [default] Engineering safeguard: an
                               #           update that survives the MAD
                               #           screen is additionally
                               #           cross-checked against the TDA
                               #           detector's predictions on the
                               #           held-out validation split.
                               #           Disabling this slows convergence
                               #           (Section 4.28.1 reports the
                               #           combined effect, not the
                               #           isolated one; see Section
                               #           7.3.1 of the thesis for the
                               #           no-ablation caveat).


# ─── Convergence ──────────────────────────────────────────────────────────
# §4.6.4, Eq. 39 and §4.28.1, Table 16. The chapter reports convergence
# in 8 epochs (achieved) against a target of ≤ 10 epochs. The achieved
# epoch count is recorded in
# outputs/tables/table_16_federated_learning.json after a full-mode run;
# the value below is the *target*, not the achievement.
convergence:
  max_epochs: 10               # [thesis] Table 16 target.
  target_accuracy: 0.992       # [thesis] Table 16 target (≥ 99.2 %).
  gradient_norm_threshold: 1.0e-3
                               # [thesis] Table 16 (δ = 10⁻³). Early
                               #          stopping fires when
                               #          ||∇L(θ_t)|| < δ for two
                               #          consecutive epochs.
  patience: 2                  # [default] Two consecutive epochs below
                               #           the threshold before stopping.
                               #           The chapter does not specify a
                               #           patience; 2 matches the
                               #           committed expected outputs.


# ─── RDP accountant ───────────────────────────────────────────────────────
# §4.22, Eq. 60. The moments accountant composes the per-round Gaussian
# mechanism over T rounds. The RDP orders below are the same set
# iterated by src/utils/math_utils.py::moments_accountant. The
# resulting ε at the pinned δ is the value checked against
# dp_sgd.epsilon above.
accountant:
  mechanism: "gaussian"        # [thesis] §4.22: Gaussian mechanism.
  composition: "rdp"           # [thesis] §4.22: RDP composition
                               #          (moments accountant).
  rdp_orders:                  # [default] Standard RDP order grid.
    - 1.25
    - 1.5
    - 1.75
    - 2
    - 2.5
    - 3
    - 4
    - 5
    - 6
    - 8
    - 10
    - 16
    - 32
    - 64
  verify_at_load: true         # [default] If true, the loader re-derives
                               #           ε from (σ, δ, C, q, T) at
                               #           startup and raises if the
                               #           result is > dp_sgd.epsilon
                               #           (i.e. the pin is no longer
                               #           valid). This is a safety net
                               #           against someone editing
                               #           batch_size or num_clients
                               #           without re-calibrating σ.


# ─── Seed ─────────────────────────────────────────────────────────────────
seed:
  dp_seed: 42                  # [default] Must equal
                               #           default_pafa_config.yaml::seed.
                               #           Consumed by
                               #           src/models/federated_learning.py
                               #           (File 12b) for the per-round
                               #           Gaussian noise sampling. Two
                               #           runs with the same seed and
                               #           the same data produce the same
                               #           noise sequence.
